# ==============================================================================
# Eden Training Institute and Therapy (EdenLMS) — Free-Tier Cloud Blueprint
# Deploys the Django API on Render Free Tier ($0/mo) and connects to Neon PostgreSQL
# ==============================================================================
services:
  - type: web
    name: edenlms-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: VIDEO_SIGNING_SECRET
        generateValue: true
      - key: DJANGO_ADMIN_URL
        value: eden-instructor-backoffice/
      - key: ENFORCE_STAFF_2FA
        value: "False"
      - key: DJANGO_SUPERUSER_EMAIL
        value: dr.violet@edenlms.org
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,.workers.dev,.pages.dev,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.workers.dev,https://*.pages.dev"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://*.workers.dev,https://*.pages.dev"
      - key: DATABASE_URL
        sync: false
      - key: DPO_COMPANY_TOKEN
        sync: false
      - key: DPO_SERVICE_TYPE
        value: "5525"
      - key: TURNSTILE_SITE_KEY
        value: "1x00000000000000000000AA"
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "edentherapycentre@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Eden Training Institute and Therapy <edentherapycentre@gmail.com>"