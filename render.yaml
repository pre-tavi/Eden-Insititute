# ==============================================================================
# Eden Training Institute and Therapy (EdenLMS) — Free-Tier Cloud Blueprint
# Deploys the Django API on Render's Free Tier ($0/mo) and connects to Neon/Render PostgreSQL
# ==============================================================================
services:
  - type: web
    name: edenlms-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: VIDEO_SIGNING_SECRET
        generateValue: true
      - key: DJANGO_ADMIN_URL
        value: eden-instructor-backoffice/
      - key: ENFORCE_STAFF_2FA
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.pages.dev"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.pages.dev"
      - key: DATABASE_URL
        sync: false
      - key: DPO_COMPANY_TOKEN
        sync: false
      - key: DPO_SERVICE_TYPE
        value: "5525"
      - key: TURNSTILE_SECRET_KEY
        sync: false